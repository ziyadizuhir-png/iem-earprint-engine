id: ynxae2

project_name: IEM EarPrint Personal Web App

version: 3.4.0

specification: General_Prompt_EarPrint_8_MATH_LOCKED.txt

specification_addendum: General_Prompt_EarPrint_8_MATH_LOCKED_boundary_addendum.txt


# ---------------------------------------------------------------------------
# Input discovery
# ---------------------------------------------------------------------------

discovery:
  preferred_glob: '*.txt'
  target_glob: '*.txt'
  ignore_files: []


# ---------------------------------------------------------------------------
# Low-frequency reference
# ---------------------------------------------------------------------------

low_frequency_reference:
  file: IEF2025.txt


# ---------------------------------------------------------------------------
# Frequency domains
# ---------------------------------------------------------------------------

frequency:
  personal_start_hz: 1000
  personal_end_hz: 12000
  output_start_hz: 20
  output_end_hz: 20186.382308152035


# ---------------------------------------------------------------------------
# Alignment
# ---------------------------------------------------------------------------

alignment:
  bands_hz:
    - - 200
      - 1000
    - - 200
      - 500
    - - 500
      - 1000
  statistic: median


# ---------------------------------------------------------------------------
# Smoothing
# ---------------------------------------------------------------------------

smoothing:
  method: gaussian
  sigma_indices: 16
  radius_indices: 64
  padding: nearest
  passes: 1


# ---------------------------------------------------------------------------
# High-frequency extension
# ---------------------------------------------------------------------------

high_frequency_extension:
  method: log_frequency
  slope_db_per_octave: -6
  display_only: true


# ---------------------------------------------------------------------------
# Repeatability
# ---------------------------------------------------------------------------

repeatability:
  enabled: false
  method: null
  note: Inactive until valid same-IEM repeats exist and a prompt-defined estimator is supplied.


# ---------------------------------------------------------------------------
# Robust Mask
# ---------------------------------------------------------------------------

robust_mask:
  enabled: true
  method: one_pass_reweighted_huber
  raw_mask_definition: Huber robust consensus Centre
  huber:
    tuning_constant: 1.345
    scale_factor: 1.4826
    scale_floor_db: 0.15
    passes: 1
  diagnostics:
    - cross_iem_mad
    - alignment_uncertainty
    - repeatability_floor
  note: Correction magnitude is not attenuated by a Retention formula.
  boundary_taper:
    method: sin2
    lower_transition_octaves: 0.3333333333333333
    upper_transition_octaves: 0.25


# ---------------------------------------------------------------------------
# LOCKED Adaptive Masked-EarPrint Handoff
# ---------------------------------------------------------------------------

adaptive_handoff:
  enabled: true
  locked: true
  nominal_anchor_hz: 1000
  min_transition_octaves: 0.3333333333333333
  max_transition_octaves: 0.8
  stability_window_octaves: 0.2

  method: earliest feasible E + exact-C1 monotone cubic Hermite shape-preserving bridge
  transition_function: monotone_cubic_hermite_true_C1
  transition_formula: cubic Hermite with raw endpoint slopes retained exactly; candidate is feasible only when alpha>=0, beta>=0, and alpha+beta<=3

  selection_rule: earliest_feasible_E
  candidate_scoring: false
  pareto_selection: false
  curvature_optimization: false

  base_target_preserved_through_h: true
  masked_earprint_exact_after_e: true

  hard_gates:
    finite: true
    monotonicity: true
    no_overshoot: true
    no_undershoot: true
    no_artificial_extrema: true
    no_slope_reversal: true
    destination_slope_stable: true
    destination_curvature_stable: true
    analytic_bridge_derivative: true
    endpoint_direction_compatibility: true

  fail_safe_status: NO_STABLE_HANDOFF


# ---------------------------------------------------------------------------
# Hybrid target generation
# ---------------------------------------------------------------------------

hybrids:
  enabled: true
  mode: on_demand
  default_join_hz: 1000
  rule: Selected target is preserved at/below join; pure EarPrint is shifted above join by the exact log-frequency join difference.


# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

output:
  delimiter: "\t"
  decimals: 12
  write_masks: true
  write_robust_targets: true
  write_pure_earprint: true
  write_hybrids: false
