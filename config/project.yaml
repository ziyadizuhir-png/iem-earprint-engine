project_name: IEM EarPrint Personal Web App
version: 3.1.0
specification: General_Prompt_EarPrint_8_MATH_LOCKED.txt
specification_addendum: General_Prompt_EarPrint_8_MATH_LOCKED_boundary_addendum.txt

discovery:
  preferred_glob: "*.txt"
  target_glob: "*.txt"
  ignore_files: []

low_frequency_reference:
  file: IEF2025.txt

frequency:
  personal_start_hz: 1000
  personal_end_hz: 12000
  output_start_hz: 20
  output_end_hz: 20186.382308152035

alignment:
  bands_hz:
    - [200, 1000]
    - [200, 500]
    - [500, 1000]
  statistic: median

smoothing:
  method: gaussian
  sigma_indices: 16
  radius_indices: 64
  padding: nearest
  passes: 1

high_frequency_extension:
  method: log_frequency
  slope_db_per_octave: -6
  display_only: true

repeatability:
  enabled: false
  method: null
  note: "Inactive until valid same-IEM repeats exist and a prompt-defined estimator is supplied."