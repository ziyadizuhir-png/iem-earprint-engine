id: ynxae2

project_name: IEM EarPrint Personal Web App

version: 3.3.0

specification: General_Prompt_EarPrint_8_MATH_LOCKED.txt

specification_addendum: General_Prompt_EarPrint_8_MATH_LOCKED_boundary_addendum.txt


# ---------------------------------------------------------------------------
# Input discovery
# ---------------------------------------------------------------------------

discovery:
  preferred_glob: '*.txt'
  target_glob: '*.txt'
  ignore_files: []


# ---------------------------------------------------------------------------
# Low-frequency reference
# ---------------------------------------------------------------------------

low_frequency_reference:
  file: IEF2025.txt


# ---------------------------------------------------------------------------
# Frequency domains
# ---------------------------------------------------------------------------

frequency:
  personal_start_hz: 1000
  personal_end_hz: 12000

  output_start_hz: 20
  output_end_hz: 20186.382308152035


# ---------------------------------------------------------------------------
# Alignment
# ---------------------------------------------------------------------------

alignment:
  bands_hz:
    - - 200
      - 1000

    - - 200
      - 500

    - - 500
      - 1000

  statistic: median


# ---------------------------------------------------------------------------
# Smoothing
# ---------------------------------------------------------------------------

smoothing:
  method: gaussian

  sigma_indices: 16

  radius_indices: 64

  padding: nearest

  passes: 1


# ---------------------------------------------------------------------------
# High-frequency extension
# ---------------------------------------------------------------------------

high_frequency_extension:
  method: log_frequency

  slope_db_per_octave: -6

  display_only: true


# ---------------------------------------------------------------------------
# Repeatability
# ---------------------------------------------------------------------------

repeatability:
  enabled: false

  method: null

  note: Inactive until valid same-IEM repeats exist and a prompt-defined estimator
    is supplied.


# ---------------------------------------------------------------------------
# Robust Mask
# ---------------------------------------------------------------------------

robust_mask:
  enabled: true

  method: one_pass_reweighted_huber

  raw_mask_definition: Huber robust consensus Centre

  huber:
    tuning_constant: 1.345

    scale_factor: 1.4826

    scale_floor_db: 0.15

    passes: 1

  diagnostics:
    - cross_iem_mad
    - alignment_uncertainty
    - repeatability_floor

  note: Correction magnitude is not attenuated by a Retention formula.

  boundary_taper:
    method: sin2

    lower_transition_octaves: 0.3333333333333333

    upper_transition_octaves: 0.25


# ---------------------------------------------------------------------------
# LOCKED Adaptive Masked-EarPrint Handoff
# ---------------------------------------------------------------------------
#
# H is fixed at 1000 Hz.
#
# The transition endpoint E is selected as the EARLIEST candidate satisfying
# every hard gate.
#
# No candidate score, Pareto ranking, weighted optimisation or curvature
# minimisation is used for E selection.
#
# Transition:
#
#   BaseTarget
#        |
#        |  H < f <= E
#        |  quintic smootherstep
#        v
#   Masked EarPrint
#
# Weight:
#
#   w(t) = 6t^5 - 15t^4 + 10t^3
#
# with:
#
#   w(0) = 0
#   w(1) = 1
#   w'(0) = 0
#   w'(1) = 0
#
# ---------------------------------------------------------------------------

adaptive_handoff:
  enabled: true

  locked: true

  nominal_anchor_hz: 1000

  min_transition_octaves: 0.3333333333333333

  max_transition_octaves: 0.8

  stability_window_octaves: 0.2

  method: earliest feasible E + quintic smootherstep bridge

  transition_function: smootherstep5

  transition_formula: "6t^5 - 15t^4 + 10t^3"

  selection_rule: earliest_feasible_E

  candidate_scoring: false

  pareto_selection: false

  curvature_optimization: false

  base_target_preserved_through_h: true

  masked_earprint_exact_after_e: true

  hard_gates:
    finite: true
    monotonicity: true
    no_overshoot: true
    no_undershoot: true
    no_artificial_extrema: true
    no_slope_reversal: true
    destination_slope_stable: true
    destination_curvature_stable: true

  fail_safe_status: NO_STABLE_HANDOFF


# ---------------------------------------------------------------------------
# Hybrid target generation
# ---------------------------------------------------------------------------

hybrids:
  enabled: true

  mode: on_demand

  default_join_hz: 1000

  rule: Selected target is preserved at/below join; pure EarPrint is shifted above
    join by the exact log-frequency join difference.


# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

output:
  delimiter: "\t"

  decimals: 12

  write_masks: true

  write_robust_targets: true

  write_pure_earprint: true

  write_hybrids: false