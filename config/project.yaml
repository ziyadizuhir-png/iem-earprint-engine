id: ynxae2
project_name: IEM EarPrint Personal Web App
version: 3.1.0
specification: General_Prompt_EarPrint_8_MATH_LOCKED.txt
specification_addendum: General_Prompt_EarPrint_8_MATH_LOCKED_boundary_addendum.txt
discovery:
  preferred_glob: '*.txt'
  target_glob: '*.txt'
  ignore_files: []
low_frequency_reference:
  file: IEF2025.txt
frequency:
  personal_start_hz: 1000
  personal_end_hz: 12000
  output_start_hz: 20
  output_end_hz: 20186.382308152035
alignment:
  bands_hz:
  - - 200
    - 1000
  - - 200
    - 500
  - - 500
    - 1000
  statistic: median
smoothing:
  method: gaussian
  sigma_indices: 16
  radius_indices: 64
  padding: nearest
  passes: 1
high_frequency_extension:
  method: log_frequency
  slope_db_per_octave: -6
  display_only: true
repeatability:
  enabled: false
  method: null
  note: Inactive until valid same-IEM repeats exist and a prompt-defined estimator
    is supplied.
robust_mask:
  enabled: true
  retention_formula: abs(centre)/(abs(centre)+total_uncertainty)
  zero_zero_rule: Retention=0 and RawMask=0 when both centre and total_uncertainty
    are exactly zero.
  total_uncertainty_components:
  - cross_iem_mad
  - alignment_uncertainty
  - repeatability_floor
  boundary_taper:
    method: sin2
    lower_transition_octaves: 0.3333333333333333
    upper_transition_octaves: 0.25
adaptive_handoff:
  enabled: true
  nominal_anchor_hz: 1000
  min_transition_octaves: 0.125
  max_transition_octaves: 0.8
  stability_window_octaves: 0.2
  method: earliest stable compatible handoff + monotonic cubic Hermite bridge
hybrids:
  enabled: true
  mode: on_demand
  default_join_hz: 1000
  rule: Selected target is preserved at/below join; pure EarPrint is shifted above
    join by the exact log-frequency join difference.
output:
  delimiter: "\t"
  decimals: 12
  write_masks: true
  write_robust_targets: true
  write_pure_earprint: true
  write_hybrids: false
