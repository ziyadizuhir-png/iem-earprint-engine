# Browser PEQ configuration. The file is JSON-compatible YAML so the static
# browser app can load it without adding a YAML runtime dependency.
{
  "version": "2026-09-25.5-vNext4-LM-IRLS",
  "topologyToleranceDb": 0.15,
  "bands": 10,
  "minFreq": 20,
  "maxFreq": 12000,
  "optHi": 10000,
  "minGain": -12,
  "maxGain": 3,
  "minQ": 0.30,
  "maxQ": 10,
  "sampleRate": 48000,
  "huberEnabled": true,
  "huberDeltaDb": 1.0,
  "huberEpsilonDb": 0.10,
  "minimumCorrectionDb": 1.0,
  "frequencyConfidence": {"below1000": 0.9, "through5000": 1.0, "through12000": 0.75, "above12000": 0.45},
  "equalLoudness": {
    "enabled": true,
    "standard": "ISO226",
    "phon": 60,
    "iemFactor": 0.5
  },
  "resolution": {"r0Points": 720, "r1Points": 240, "r2Points": 96, "tonalOctaves": 0.1666666667},
  "quantization": {"freqHz": 1, "gainDb": 0.01, "q": 0.01},
  "feature": {"prominenceDb": 0.15, "minWidthOct": 0.05, "supportOct": 0.12},
  "hfValidation": {"startHz": 12000, "endHz": 20000, "maxDeviationDb": 6, "maxSlopeDbPerOct": 18},
  "solver": {
    "mode": "lm-irls",
    "initialBands": 3,
    "growth": [3, 5, 7, 10],
    "candidateLimit": 24,
    "minBandImprovementDb": 0.004,
    "lmPoints": 240,
    "maxIterations": 8,
    "irlsIterations": 2,
    "lambdaInitial": 0.03,
    "lambdaUp": 6.0,
    "lambdaDown": 0.35,
    "maxRejectedSteps": 5,
    "stepTolerance": 0.0001,
    "lossTolerance": 0.0000001,
    "freqJacobianStep": 0.003,
    "gainJacobianStepDb": 0.03,
    "qJacobianStep": 0.01,
    "gainRegularization": 0.0008,
    "highQRegularization": 0.0015,
    "boundaryHz": 1000,
    "boundaryWidthOct": 0.10,
    "boundaryHighQPenalty": 0.004,
    "perturbationMaxRmseDeltaDb": 0.08,
    "quantizationRescuePasses": 1
  }
}
