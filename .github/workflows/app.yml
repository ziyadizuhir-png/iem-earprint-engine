name: Check EarPrint Web App

on:
  push:
    paths:
      - "app/**"
      - "tests/test_peq_node.js"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check Pudding PEQ JavaScript syntax
        run: node --check app/pudding_peq.js
      - name: Run deterministic PEQ regression tests
        run: node tests/test_peq_node.js
