name: Build IEM EarPrint

on:
  push:
    paths:
      - "input/**"
      - "config/**"
      - "engine/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic EarPrint engine
        run: python engine/earprint_engine.py

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/ reports/

          if git diff --cached --quiet; then
            echo "No generated result changes."
          else
            git commit -m "Update EarPrint results"
            git push
          fi
