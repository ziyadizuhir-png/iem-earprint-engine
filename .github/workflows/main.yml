name: Build IEM EarPrint

on:
  push:
    paths:
      - "input/**"
      - "config/**"
      - "engine/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
      - "ARCHITECTURE_LOCK.md"
      - "General_Prompt_EarPrint_8_MATH_LOCKED_boundary_addendum.txt"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# Only one build may publish at a time.
# If a newer input commit arrives, the older build is cancelled.
concurrency:
  group: earprint-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check generated-result cache
        shell: bash
        run: |
          CURRENT_HASH="$(python engine/input_hash.py)"
          STORED_HASH="$(cat reports/build_input_hash.txt 2>/dev/null || true)"
          if [ "$CURRENT_HASH" = "$STORED_HASH" ] \
            && test -f output/pure_earprint_dynamic.txt \
            && test -f reports/manifest.json \
            && test -f reports/validation.txt; then
            echo "EARPRINT_CACHE_HIT=true" >> "$GITHUB_ENV"
            echo "EarPrint cache hit: $CURRENT_HASH"
          else
            echo "EARPRINT_CACHE_HIT=false" >> "$GITHUB_ENV"
            echo "EarPrint cache miss: $CURRENT_HASH"
          fi

      - name: Run deterministic unit tests
        run: python -m pytest -q

      - name: Snapshot generated results
        if: env.EARPRINT_CACHE_HIT != 'true'
        run: |
          rm -rf .generated-backup
          mkdir -p .generated-backup
          cp -a output .generated-backup/output
          cp -a reports .generated-backup/reports

      - name: Run math-locked EarPrint engine
        if: env.EARPRINT_CACHE_HIT != 'true'
        run: |
          set -e
          SECONDS=0
          if python engine/earprint_engine.py; then
            echo "EarPrint engine runtime: ${SECONDS}s"
            exit 0
          fi

          echo "EarPrint engine runtime before failure: ${SECONDS}s"
          echo "Engine failed; restoring the previous generated results."
          rm -rf output reports
          cp -a .generated-backup/output output
          cp -a .generated-backup/reports reports
          exit 1

      - name: Run generated-output regression checks
        run: python -m pytest -q tests/test_regression_outputs.py

      - name: Record generated-result cache hash
        if: env.EARPRINT_CACHE_HIT != 'true'
        run: python engine/input_hash.py > reports/build_input_hash.txt

      - name: Remove generated-results snapshot
        if: always()
        run: rm -rf .generated-backup

      # Never publish results calculated from an old input state.
      - name: Verify source revision is still current
        run: |
          git fetch origin main

          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [ "$SOURCE_SHA" != "$REMOTE_SHA" ]; then
            echo "Source changed while this build was running."
            echo "This build is stale and will not publish generated results."
            echo "A newer workflow run owns the current main state."
            exit 0
          fi

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/ reports/

          if git diff --cached --quiet; then
            echo "No generated result changes."
            exit 0
          fi

          git commit -m "Update EarPrint results"

          # Do not pull/rebase generated files. That was the source of
          # manifest/robust_statistics merge conflicts in the old workflow.
          BASE_SHA="$(git rev-parse HEAD^)"

          if git push origin HEAD:main; then
            echo "Generated results published successfully."
            exit 0
          fi

          # A concurrent main update means this build is stale.
          echo "Push was rejected because main changed during publication."
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "A newer commit is now on main."
            echo "This generated result is stale; leaving publication to the newer build."
            exit 0
          fi

          echo "Push failed for a reason other than a concurrent main update."
          exit 1
