name: Build IEM EarPrint

on:
  push:
    paths:
      - "input/**"
      - "config/**"
      - "engine/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earprint-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run math-locked EarPrint engine
        run: python engine/earprint_engine.py

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ reports/
          if git diff --cached --quiet; then
            echo "No generated result changes."
            exit 0
          fi
          git commit -m "Update EarPrint results"
          git pull --rebase origin main
          git push origin HEAD:main
